# Weekly refresh of burn attendance figures.
#
# Attendance isn't carried by any data feed, so scripts/scrape-attendance.mjs
# does best-effort automated research — Wikipedia + each burn's own website —
# and merges the result on top of the hand-curated public/attendance-overrides.json
# (which always wins). This workflow runs it weekly and commits the regenerated
# public/attendance.json.
#
# To correct a bad auto-scraped value, or add a figure the scraper can't reach
# (e.g. a PDF AfterBurn report), edit public/attendance-overrides.json by hand.
#
# Manual trigger: Actions tab -> "Refresh attendance" -> Run workflow.

name: Refresh attendance

on:
  schedule:
    # Every Monday at 15:00 UTC (an hour after the sanctioned-events scrape).
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # scrape-attendance reads public/data/festivals.json — build it first.
      - name: Snapshot festival registry
        run: node scripts/fetch-data.mjs
      - name: Scrape attendance figures
        run: node scripts/scrape-attendance.mjs
      - name: Commit updated attendance snapshot
        run: |
          if git diff --quiet -- public/attendance.json; then
            echo "No change in attendance.json — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/attendance.json
          git commit -m "chore: refresh attendance.json (weekly scrape)"
          git push
